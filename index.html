<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AdBlue AR - Podgląd Na Żywo</title>
    <style>
        :root { --primary: #0056b3; --success: #28a745; }
        body { margin: 0; padding: 0; overflow: hidden; background: black; font-family: sans-serif; }
        
        /* Kontener na kamerę */
        #camera-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        video {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        /* Kontener AdBlue */
        #overlay-img {
            position: absolute;
            top: 30%; left: 25%;
            width: 250px;
            z-index: 10;
            touch-action: none;
            filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.5));
        }

        /* Interfejs */
        .ui-panel {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 15px;
            box-sizing: border-box;
            z-index: 100;
            border-radius: 20px 20px 0 0;
        }
        button {
            padding: 15px 5px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font-weight: bold;
            font-size: 13px;
        }
        .size-btn { background: #333; }
        .save-btn { grid-column: span 3; background: var(--success); font-size: 16px; }
    </style>
</head>
<body>

<div id="camera-container">
    <video id="video" autoplay playsinline></video>
    <img id="overlay-img" src="images/kontener-skos.png">
</div>

<div class="ui-panel">
    <button onclick="changeView('images/kontener-skos.png')">Widok Skos</button>
    <button onclick="changeView('images/kontener-przod.png')">Widok Przód</button>
    <button onclick="changeView('images/kontener-bok.png')">Widok Bok</button>
    
    <button class="size-btn" onclick="adjustSize(1.1)">➕ Powiększ</button>
    <button class="size-btn" style="grid-column: span 2" onclick="adjustSize(0.9)">➖ Pomniejsz</button>

    <button class="save-btn" onclick="takeSnapshot()">ZAPISZ WIZUALIZACJĘ (FOTO)</button>
</div>

<script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay-img');
    let scale = 250;
    let posX = window.innerWidth / 4;
    let posY = window.innerHeight / 3;

    // Uruchomienie kamery
    async function setupCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment" }, // Użyj tylnej kamery
                audio: false 
            });
            video.srcObject = stream;
        } catch (err) {
            alert("Błąd kamery: Upewnij się, że nadałeś uprawnienia w przeglądarce.");
        }
    }

    function changeView(path) { overlay.src = path; }

    function adjustSize(factor) {
        scale *= factor;
        overlay.style.width = scale + 'px';
    }

    // Przesuwanie palcem
    let isDragging = false;
    overlay.onpointerdown = (e) => { isDragging = true; overlay.setPointerCapture(e.pointerId); };
    overlay.onpointerup = () => { isDragging = false; };
    overlay.onpointermove = (e) => {
        if (!isDragging) return;
        posX += e.movementX;
        posY += e.movementY;
        overlay.style.left = posX + 'px';
        overlay.style.top = posY + 'px';
    };

    function takeSnapshot() {
        alert("Teraz zrób zrzut ekranu (Screen Shot) swoim telefonem, aby zapisać ten widok!");
    }

    setupCamera();
</script>

</body>
</html>
