<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AdBlue AR - Gesty Dotykowe</title>
    <style>
        :root { --primary: #0056b3; --success: #28a745; }
        body { margin: 0; padding: 0; overflow: hidden; background: black; font-family: sans-serif; }
        
        #camera-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: cover; }

        #overlay-img {
            position: absolute; top: 30%; left: 25%; width: 250px;
            z-index: 10; touch-action: none;
            filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.5));
            transform-origin: center center;
        }

        .ui-panel {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px; padding: 15px; box-sizing: border-box;
            z-index: 100; border-radius: 20px 20px 0 0;
        }
        button {
            padding: 20px 5px; border: none; border-radius: 12px;
            background: var(--primary); color: white; font-weight: bold; font-size: 14px;
        }
        .save-btn { grid-column: span 3; background: var(--success); font-size: 18px; height: 65px; margin-top: 5px; }
        
        #preview-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 200;
            flex-direction: column; align-items: center; justify-content: center;
        }
        #preview-img { max-width: 90%; max-height: 70%; border: 5px solid white; border-radius: 10px; }
        .preview-text { color: white; margin: 15px; font-weight: bold; text-align: center; }
        #snapshot-canvas { display: none; }
    </style>
</head>
<body>

<div id="camera-container">
    <video id="video" autoplay playsinline></video>
    <img id="overlay-img" src="images/kontener-skos.png">
</div>

<div id="preview-overlay">
    <div class="preview-text">ZDJĘCIE ZAPISANE</div>
    <img id="preview-img">
    <button style="background: #dc3545; width: 80%; margin-top: 20px;" onclick="document.getElementById('preview-overlay').style.display='none'">WRÓĆ</button>
</div>

<canvas id="snapshot-canvas"></canvas>

<div class="ui-panel">
    <button onclick="changeView('images/kontener-skos.png')">Widok Skos</button>
    <button onclick="changeView('images/kontener-przod.png')">Widok Przód</button>
    <button onclick="changeView('images/kontener-bok.png')">Widok Bok</button>
    <button class="save-btn" onclick="takePhoto()">📸 ZRÓB I ZAPISZ ZDJĘCIE</button>
</div>

<script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay-img');
    const canvas = document.getElementById('snapshot-canvas');
    
    let scale = 1;
    let rotation = 0;
    let posX = window.innerWidth / 4;
    let posY = window.innerHeight / 3;

    // GESTY - BIBLIOTEKA LOGIKI
    let initialDist = 0;
    let initialScale = 1;

    overlay.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
            initialDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            initialScale = scale;
        }
    });

    overlay.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length === 1) {
            // Przesuwanie
            posX = e.touches[0].pageX - (overlay.offsetWidth / 2);
            posY = e.touches[0].pageY - (overlay.offsetHeight / 2);
        } else if (e.touches.length === 2) {
            // Skalowanie (szczypanie)
            const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            scale = initialScale * (dist / initialDist);
        }
        updateTransform();
    }, {passive: false});

    function updateTransform() {
        overlay.style.left = posX + 'px';
        overlay.style.top = posY + 'px';
        overlay.style.transform = `scale(${scale})`;
    }

    async function setupCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1920 } }, audio: false 
            });
            video.srcObject = stream;
        } catch (err) { alert("Błąd kamery. Użyj HTTPS."); }
    }

    function changeView(path) { overlay.src = path; }

    function takePhoto() {
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const rect = video.getBoundingClientRect();
        const ratioX = canvas.width / rect.width;
        const ratioY = canvas.height / rect.height;

        // Uwzględnienie skali z transform: scale()
        const finalW = overlay.offsetWidth * scale * ratioX;
        const finalH = overlay.offsetHeight * scale * ratioY;
        const finalX = (posX + (overlay.offsetWidth/2) - (overlay.offsetWidth * scale / 2)) * ratioX;
        const finalY = (posY + (overlay.offsetHeight/2) - (overlay.offsetHeight * scale / 2)) * ratioY;

        const img = new Image();
        img.src = overlay.src;
        img.onload = () => {
            ctx.drawImage(img, finalX, finalY, finalW, finalH);
            const dataURL = canvas.toDataURL("image/png");
            document.getElementById('preview-img').src = dataURL;
            document.getElementById('preview-overlay').style.display = 'flex';
            
            const link = document.createElement('a');
            link.download = `AdBlue_AR.png`;
            link.href = dataURL;
            link.click();
        };
    }

    setupCamera();
    updateTransform();
</script>

</body>
</html>
